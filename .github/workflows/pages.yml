# Publishes the static front-end (docs/) to GitHub Pages.
#
# The Pages site is the UI only — it fetches data from your deployed backend
# API (set the endpoint via the ⚙ button in the top-right of the page). The
# backend needs the shared Schwab token, so it must run somewhere that can hold
# a secret (e.g. Railway); GitHub Pages cannot.
name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
